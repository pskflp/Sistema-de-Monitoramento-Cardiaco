<ion-header>
  <ion-toolbar color="white">
    <ion-title>Monitoramento</ion-title>
    <ion-buttons slot="end">
      <ion-button routerLink="/relatorio">
        <ion-icon slot="icon-only" name="analytics-outline" color="danger"></ion-icon>
      </ion-button>
      <ion-button routerLink="/integrantes">
        <ion-icon slot="icon-only" name="people-outline" color="dark"></ion-icon>
      </ion-button>
      <ion-button (click)="logout()">
        <ion-icon slot="icon-only" name="log-out-outline" color="dark"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="center-wrapper">
    <div class="form-card">
      <div class="ion-text-center ion-padding">
        <h2 class="form-title">Novo Registro</h2>
        <p class="form-subtitle">Informe seus dados vitais atuais</p>
      </div>

      <div class="ion-padding-horizontal">
        
        <div class="section-title" style="font-size: 0.8rem; font-weight: 700; color: #495057; text-transform: uppercase; margin-bottom: 12px;">
          Sinais Vitais
        </div>

        <div class="grid-row">
          <div style="flex: 1; background: #f8f9fa; padding: 4px 12px; border-radius: 8px;">
            <ion-item lines="none" style="--background: transparent; --padding-start: 0;">
              <ion-input label="Sistólica (mmHg)" labelPlacement="stacked" type="number" [(ngModel)]="form.pressaoSistolica" placeholder="120" style="font-weight: 700;"></ion-input>
            </ion-item>
          </div>
          <div style="flex: 1; background: #f8f9fa; padding: 4px 12px; border-radius: 8px;">
            <ion-item lines="none" style="--background: transparent; --padding-start: 0;">
              <ion-input label="Diastólica (mmHg)" labelPlacement="stacked" type="number" [(ngModel)]="form.pressaoDiastolica" placeholder="80" style="font-weight: 700;"></ion-input>
            </ion-item>
          </div>
        </div>

        <div class="grid-row" style="margin-top: 12px;">
          <div style="flex: 1; background: #f8f9fa; padding: 4px 12px; border-radius: 8px;">
            <ion-item lines="none" style="--background: transparent; --padding-start: 0;">
              <ion-input label="Frequência (bpm)" labelPlacement="stacked" type="number" [(ngModel)]="form.frequenciaCardiaca" placeholder="75" style="font-weight: 700;"></ion-input>
            </ion-item>
          </div>
          <div style="flex: 1; background: #f8f9fa; padding: 4px 12px; border-radius: 8px;">
            <ion-item lines="none" style="--background: transparent; --padding-start: 0;">
              <ion-input label="Oxigênio (%)" labelPlacement="stacked" type="number" [(ngModel)]="form.oxigenacao" placeholder="98" style="font-weight: 700;"></ion-input>
            </ion-item>
          </div>
        </div>

        <div style="margin-top: 12px; background: #f8f9fa; padding: 4px 12px; border-radius: 8px;">
          <ion-item lines="none" style="--background: transparent; --padding-start: 0;">
            <ion-input label="Peso (kg)" labelPlacement="stacked" type="number" [(ngModel)]="form.peso" placeholder="70.0" style="font-weight: 700;"></ion-input>
          </ion-item>
        </div>

        <div class="symptoms-section" style="margin-top: 24px;">
          <div class="section-title" style="color: var(--app-danger); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; display: flex; align-items: center; gap: 4px;">
            <ion-icon name="warning-outline"></ion-icon>
            Atenção Médica / Sintomas
          </div>
          
          <div class="toggle-list">
            <ion-item lines="none">
              <ion-toggle justify="space-between" [(ngModel)]="form.faltaDeAr">Falta de ar</ion-toggle>
            </ion-item>
            <ion-item lines="none">
              <ion-toggle justify="space-between" [(ngModel)]="form.dorNoPeito">Dor no peito</ion-toggle>
            </ion-item>
            <ion-item lines="none">
              <ion-toggle justify="space-between" [(ngModel)]="form.tontura">Tontura</ion-toggle>
            </ion-item>
          </div>
        </div>

        <ion-button expand="block" (click)="registrar()" class="btn-submit ion-margin-vertical">
          Salvar Dados
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
