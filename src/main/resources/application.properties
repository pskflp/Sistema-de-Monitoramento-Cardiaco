spring.application.name=MonitoramentoCardiaco

# Banco de dados H2 em memoria: nao requer instalacao.
# Os dados existem apenas enquanto a aplicacao esta em execucao.
spring.datasource.url=jdbc:h2:mem:monitoramento;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Console web do H2 (opcional), disponivel em http://localhost:8080/h2-console
spring.h2.console.enabled=true
